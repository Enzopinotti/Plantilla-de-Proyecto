name: Bootstrap starter lockfile

on:
  push:
    branches:
      - feat/modern-node-service-starter
    paths:
      - package.json
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: starter-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out starter branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/modern-node-service-starter
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Generate lockfile from the new starter manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Install and normalize new starter sources
        run: |
          npm ci
          npm run format
      - name: Validate starter contracts
        run: npm run check
      - name: Commit generated lockfile and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- package-lock.json package.json eslint.config.js tsconfig.json tsconfig.build.json src test)" ]]; then
            echo "Starter lockfile and formatting are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json eslint.config.js tsconfig.json tsconfig.build.json src test
          git commit -m "chore: normalize starter dependencies and formatting"
          git push origin HEAD:feat/modern-node-service-starter
